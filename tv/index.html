<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教会エントランス インフォメーション</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #245a35;
      --forest-deep: #f5f8f3;
      --leaf: #48a83f;
      --sage: #8bc34a;
      --gold: #f3c85b;
      --cream: #ffffff;
      --ink: #202923;
    }

    /* 基本レイアウト (テレビの表示領域いっぱいに追従) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--forest-deep);
      font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: var(--ink);
      display: grid;
      grid-template-columns: 63% 37%;
      grid-template-rows: 92.5vh 7.5vh;
    }
    .main-area {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #e9f1e7;
    }

    /* スライド手動送りボタン */
    .slide-next-btn {
      position: absolute;
      bottom: 28px;
      right: 28px;
      background: rgba(72, 168, 63, 0.96);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 30px;
      padding: 12px 24px;
      font-size: clamp(16px, 1.1vw, 22px);
      font-weight: bold;
      cursor: pointer;
      z-index: 30;
      box-shadow: 0 8px 24px rgba(30, 75, 37, 0.3);
      transition: background 0.2s, transform 0.2s;
    }
    .slide-next-btn:hover {
      background: #388e3c;
      transform: scale(1.05);
    }
    .brand-logo {
      position: absolute;
      top: 30px;
      left: 34px;
      width: clamp(76px, 6.2vw, 118px);
      height: clamp(76px, 6.2vw, 118px);
      object-fit: contain;
      padding: 7px;
      background: #fff;
      border: 2px solid rgba(72, 168, 63, 0.8);
      border-radius: 22px;
      z-index: 20;
      box-shadow: 0 12px 32px rgba(22, 55, 30, 0.25);
    }
    .slide-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
      background-size: cover;
      background-position: center;
    }
    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(13, 35, 24, 0.04) 30%, rgba(13, 35, 24, 0.1) 68%, rgba(13, 35, 24, 0.3) 100%);
      pointer-events: none;
    }
    .slide.active {
      opacity: 1;
    }
    .slide.homepage-scroll {
      background-size: 100% auto;
      background-repeat: no-repeat;
      background-color: #18362a;
      background-position: center top;
    }
    .slide.active.homepage-scroll {
      animation: homepage-scroll 24s ease-in-out infinite alternate;
    }
    .slide.instagram-scroll {
      background-size: 100% auto;
      background-repeat: no-repeat;
      background-color: #18362a;
      background-position: center top;
    }
    .slide.active.instagram-scroll {
      animation: instagram-scroll 32s ease-in-out infinite alternate;
    }
    .slide.photo-pan {
      background-size: cover;
      background-repeat: no-repeat;
    }
    .slide.active.photo-pan {
      animation: photo-pan 7s ease-in-out infinite alternate;
    }
    .slide.album-photo .slide-card {
      right: auto;
      max-width: min(72%, 780px);
      padding: clamp(14px, 1.4vw, 26px) clamp(18px, 2vw, 38px);
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(4px);
    }
    .slide.album-photo .slide-tag {
      font-size: clamp(13px, 1vw, 18px);
      padding: 4px 12px;
      margin-bottom: 8px;
    }
    .slide.album-photo .slide-title {
      font-size: clamp(24px, 1.8vw, 36px);
      line-height: 1.25;
    }
    .slide.album-photo .slide-sub {
      font-size: clamp(14px, 1vw, 20px);
      margin-top: 4px;
    }
    @keyframes homepage-scroll {
      0% { background-position: center top; }
      100% { background-position: center bottom; }
    }
    @keyframes instagram-scroll {
      0% { background-position: center top; }
      100% { background-position: center bottom; }
    }
    @keyframes photo-pan {
      0% {
        background-position: 48% 50%;
      }
      100% {
        background-position: 52% 50%;
      }
    }

    /* スライド内のテキストオーバーレイ（擦りガラス風カード） */
    .slide-card {
      position: absolute;
      bottom: clamp(28px, 3.2vw, 62px);
      left: clamp(28px, 3.2vw, 62px);
      right: clamp(28px, 3.2vw, 62px);
      background: linear-gradient(115deg, rgba(255, 255, 255, 0.97), rgba(249, 252, 247, 0.94));
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-left: 7px solid var(--leaf);
      border-radius: 8px 24px 24px 8px;
      padding: clamp(24px, 2.7vw, 52px) clamp(28px, 3.2vw, 62px);
      box-shadow: 0 24px 60px rgba(18, 45, 25, 0.24);
      backdrop-filter: blur(10px);
      color: var(--ink);
    }
    .slide-tag {
      display: inline-block;
      background: rgba(72, 168, 63, 0.1);
      color: #348b35;
      border: 1px solid rgba(72, 168, 63, 0.36);
      font-size: clamp(16px, 1.35vw, 26px);
      font-weight: bold;
      padding: 6px 18px;
      border-radius: 30px;
      margin-bottom: 18px;
      letter-spacing: 0.05em;
    }
    .slide-title {
      font-size: clamp(36px, 3.1vw, 60px);
      line-height: 1.35;
      font-weight: 900;
      letter-spacing: 0.03em;
      color: #202923;
      text-shadow: 0 2px 8px rgba(255, 255, 255, 0.4);
    }
    .slide-sub {
      font-size: clamp(20px, 1.8vw, 34px);
      color: #4e6254;
      margin-top: 18px;
      text-align: right;
      font-weight: 500;
    }
    .slide-sub.link {
      font-size: 22px;
      line-height: 1.35;
      overflow-wrap: anywhere;
      white-space: normal;
    }
    .slide-title.lyrics {
      font-size: 38px;
      line-height: 1.4;
      font-weight: 700;
      color: #ffd166;
      margin-bottom: 8px;
      white-space: pre-line;
    }
    .lyrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 36px;
      margin-top: 10px;
    }
    .lyrics-column-label {
      font-size: 28px;
      font-weight: 700;
      color: #48a83f;
      margin-bottom: 8px;
    }
    .lyrics-column-text {
      font-size: 34px;
      line-height: 1.6;
      font-weight: 700;
      white-space: pre-line;
      color: #24362b;
    }
    .slide-meaning {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      font-size: 25px;
      line-height: 1.55;
      color: #526858;
      font-weight: 500;
    }

    /* 右側：サイドバー */
    .sidebar {
      background: #fff;
      border-left: 1px solid rgba(72, 168, 63, 0.38);
      padding: clamp(24px, 2.2vw, 42px);
      display: flex;
      flex-direction: column;
      gap: clamp(22px, 2.4vw, 46px);
    }

    /* 日時・時計 */
    .clock-panel {
      position: relative;
      background: linear-gradient(135deg, #ffffff, #f6fbf2);
      border-radius: 22px;
      padding: clamp(20px, 2vw, 38px);
      text-align: center;
      border: 1px solid rgba(72, 168, 63, 0.32);
      box-shadow: 0 16px 36px rgba(32, 67, 37, 0.12);
    }
    .clock-panel::before {
      content: "HITACHI HIKARI CHURCH";
      display: block;
      margin-bottom: 8px;
      color: #62975a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
    }
    .clock-time {
      font-size: clamp(64px, 5.4vw, 104px);
      font-weight: 700;
      font-family: monospace, sans-serif;
      letter-spacing: 0.02em;
      line-height: 1.05;
      color: var(--forest);
    }
    .clock-date {
      font-size: clamp(18px, 1.35vw, 26px);
      color: #56884e;
      margin-top: 10px;
      white-space: nowrap;
    }

    /* プログラムリスト */
    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(22px, 1.7vw, 32px);
      font-weight: 700;
      color: #245a35;
      border-bottom: 1px solid rgba(72, 168, 63, 0.42);
      padding-bottom: 14px;
      margin-bottom: 16px;
      letter-spacing: 0.04em;
    }
    .section-title::before {
      content: "";
      width: 5px;
      height: 1.1em;
      border-radius: 4px;
      background: var(--leaf);
    }
    .schedule-header {
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 14px;
      padding: 12px 18px;
      background: linear-gradient(90deg, #48a83f, #74bd47);
      color: #fff;
      border: 1px solid rgba(72, 168, 63, 0.4);
      border-radius: 12px 12px 0 0;
      font-size: clamp(15px, 1.05vw, 20px);
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .schedule-list {
      display: flex;
      flex-direction: column;
      background: var(--cream);
      border: 1px solid rgba(72, 168, 63, 0.26);
      border-top: 0;
      border-radius: 0 0 12px 12px;
      overflow: hidden;
      box-shadow: 0 16px 34px rgba(32, 67, 37, 0.1);
    }
    .schedule-item {
      display: grid;
      grid-template-columns: 104px 1fr;
      gap: 14px;
      align-items: center;
      padding: 13px 18px;
      border-bottom: 1px solid #e3ebdf;
    }
    .schedule-item:last-child {
      border-bottom: 0;
    }
    .schedule-time {
      font-size: clamp(17px, 1.2vw, 23px);
      font-weight: bold;
      color: #388e3c;
      font-family: monospace, sans-serif;
      white-space: nowrap;
    }
    .schedule-name {
      font-size: clamp(17px, 1.15vw, 22px);
      line-height: 1.3;
      font-weight: 500;
      color: #243c31;
    }

    /* 複数QRコード領域 */
    .qr-panel {
      margin-top: auto;
      background: #f0f5ed;
      border-radius: 16px;
      padding: 16px 20px;
      border: 2px solid #a4bea0;
    }
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .qr-item {
      background: #fff;
      padding: 8px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #c8d8c2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .qr-item img {
      width: 76px;
      height: 76px;
      display: block;
      margin: 0 auto 4px auto;
    }
    .qr-label {
      font-size: 11px;
      font-weight: bold;
      color: #19392c;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .qr-desc-title {
      font-size: 14px;
      font-weight: bold;
      color: #19392c;
      text-align: center;
      margin-bottom: 8px;
    }

    /* スライド内のリンク・QRレイアウト */
    .slide-link-layout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }
    .slide-link-text {
      flex: 1;
    }
    .slide-link-badges {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.97);
      padding: 16px 24px;
      border-radius: 16px;
      border: 2px solid rgba(72, 168, 63, 0.56);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .slide-badge-icon {
      width: 76px;
      height: 76px;
      object-fit: contain;
      border-radius: 12px;
      background: #fff;
      padding: 4px;
      border: 2px solid #a4bea0;
    }
    .slide-platform-icon {
      width: 68px;
      height: 68px;
      flex-shrink: 0;
    }
    .slide-badge-qr {
      width: 104px;
      height: 104px;
      object-fit: contain;
      display: block;
    }

    /* 最下部：テロップティッカー（太字化） */
    .ticker-bar {
      grid-column: 1 / -1;
      background: linear-gradient(90deg, #378c39, #57ae41);
      border-top: 1px solid rgba(255, 255, 255, 0.52);
      display: flex;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .ticker-label {
      background: #2f7737;
      color: #fff;
      font-weight: 900;
      font-size: clamp(18px, 1.35vw, 26px);
      padding: 0 28px;
      height: 100%;
      display: flex;
      align-items: center;
      z-index: 10;
      flex-shrink: 0;
    }
    .ticker-content {
      white-space: nowrap;
      padding-left: 100%;
      display: inline-block;
      animation: ticker 35s linear infinite;
      font-size: clamp(20px, 1.55vw, 30px);
      font-weight: 700;
      color: #fff;
    }


    @keyframes ticker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>

    // --- 時計更新 ---
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clockTime').textContent = `${hours}:${minutes}`;

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      const day = days[now.getDay()];
      document.getElementById('clockDate').textContent = `${year}年${month}月${date}日 (${day})`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- プログラムとテロップの初期描画 ---
    function initContents() {
      document.getElementById('reportTitle').textContent = signageData.report.title;

      // スケジュール
      const scheduleList = document.getElementById('scheduleList');
      scheduleList.innerHTML = signageData.schedules.map(item => `
        <div class="schedule-item">
          <div class="schedule-time">${item.time}</div>
          <div class="schedule-name">${item.name}</div>
        </div>
      `).join('');

      // スライド生成
      const container = document.getElementById('slideContainer');
      container.innerHTML = signageData.slides.map((s, idx) => `
        <div class="slide ${idx === 0 ? 'active' : ''} ${s.kind || ''} ${s.albumPhoto ? 'album-photo' : ''}" style="background-image: url('${s.bg}');">
          <div class="slide-card">
            <div class="slide-tag">${s.tag}</div>
            ${s.url ? `
              <div class="slide-link-layout">
                <div class="slide-link-text">
                  <div class="slide-title ${s.kind || ''}">${s.title}</div>
                  <div class="slide-sub link">${s.sub}</div>
                </div>
                <div class="slide-link-badges">
                  ${s.platform === 'instagram' ? `
                    <svg class="slide-platform-icon" viewBox="0 0 64 64" role="img" aria-label="Instagram">
                      <defs>
                        <linearGradient id="instagram-gradient" x1="0" y1="1" x2="1" y2="0">
                          <stop offset="0" stop-color="#ffb13d"/>
                          <stop offset=".5" stop-color="#e1306c"/>
                          <stop offset="1" stop-color="#833ab4"/>
                        </linearGradient>
                      </defs>
                      <rect x="7" y="7" width="50" height="50" rx="15" fill="none" stroke="url(#instagram-gradient)" stroke-width="5"/>
                      <circle cx="32" cy="32" r="12" fill="none" stroke="url(#instagram-gradient)" stroke-width="5"/>
                      <circle cx="47" cy="17" r="3.5" fill="#e1306c"/>
                    </svg>
                  ` : s.platform === 'youtube' ? `
                    <svg class="slide-platform-icon" viewBox="0 0 64 64" role="img" aria-label="YouTube">
                      <rect x="4" y="12" width="56" height="40" rx="12" fill="#ff0033"/>
                      <path d="M27 22v20l17-10z" fill="#fff"/>
                    </svg>
                  ` : ''}
                  ${s.icon ? `<img src="${s.icon}" class="slide-badge-icon" alt="アイコン">` : ''}
                  <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(s.url)}" class="slide-badge-qr" alt="QRコード">
                </div>
              </div>
            ` : `
              <div class="slide-title ${s.kind || ''}">${s.title}</div>
              ${s.lyrics ? `<div class="lyrics-grid"><div><div class="lyrics-column-label">本文</div><div class="lyrics-column-text">${s.lyrics}</div></div><div><div class="lyrics-column-label">意味</div><div class="lyrics-column-text">${s.meaning}</div></div></div>` : ''}
              <div class="slide-sub">${s.sub}</div>
            `}
          </div>
        </div>
      `).join('');

      // テロップ
      const tickerContainer = document.getElementById('tickerContent');
      tickerContainer.innerHTML = signageData.tickers.map(t => `<span class="ticker-item">● ${t}</span>`).join('');
    }
    initContents();

    // --- スライド自動切り替え・手動切り替え制御 ---
    let currentSlide = 0;
    let slideInterval = setInterval(autoAdvanceSlide, 16000);

    function showSlide(index) {
      const slides = document.querySelectorAll('.slide');
      if (slides.length === 0) return;
      slides[currentSlide].classList.remove('active');
      currentSlide = (index + slides.length) % slides.length;
      slides[currentSlide].classList.add('active');
    }

    function autoAdvanceSlide() {
      showSlide(currentSlide + 1);
    }

    function nextSlide() {
      // 手動で次へ送ったときはタイマーをリセットして再カウント
      showSlide(currentSlide + 1);
      clearInterval(slideInterval);
      slideInterval = setInterval(autoAdvanceSlide, 16000);
    }

    // --- メモリリーク防止（6時間ごとにページリロード） ---
    setTimeout(() => {
      location.reload();
    }, 6 * 60 * 60 * 1000);
  </script>
